<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Kubernetes Service Mesh Architecture</text>

  <!-- Client -->
  <rect x="30" y="120" width="120" height="70" rx="10" fill="#e8eaf6" stroke="#326CE5" stroke-width="2"/>
  <text x="90" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Client</text>
  <text x="90" y="170" text-anchor="middle" font-size="12" fill="#555">HTTPS request</text>

  <!-- Ingress Gateway -->
  <rect x="210" y="120" width="150" height="70" rx="10" fill="#e3f2fd" stroke="#0277bd" stroke-width="2"/>
  <text x="285" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Ingress Gateway</text>
  <text x="285" y="170" text-anchor="middle" font-size="12" fill="#555">Envoy · TLS termination</text>

  <!-- Service A pod -->
  <rect x="430" y="90" width="200" height="130" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="530" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Pod: Service A</text>
  <rect x="450" y="122" width="80" height="40" rx="6" fill="#ffffff" stroke="#f9a825"/>
  <text x="490" y="147" text-anchor="middle" font-size="12" fill="#333">App A</text>
  <rect x="550" y="122" width="80" height="40" rx="6" fill="#ffe082" stroke="#f9a825"/>
  <text x="590" y="147" text-anchor="middle" font-size="12" fill="#333">Sidecar</text>
  <rect x="450" y="172" width="180" height="32" rx="6" fill="#fffde7" stroke="#f9a825" stroke-dasharray="4 3"/>
  <text x="540" y="192" text-anchor="middle" font-size="11" fill="#555">mTLS · routing · telemetry</text>

  <!-- Service B pod -->
  <rect x="690" y="90" width="200" height="130" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="790" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Pod: Service B</text>
  <rect x="710" y="122" width="80" height="40" rx="6" fill="#ffffff" stroke="#43a047"/>
  <text x="750" y="147" text-anchor="middle" font-size="12" fill="#333">App B</text>
  <rect x="810" y="122" width="80" height="40" rx="6" fill="#c8e6c9" stroke="#43a047"/>
  <text x="850" y="147" text-anchor="middle" font-size="12" fill="#333">Sidecar</text>
  <rect x="710" y="172" width="180" height="32" rx="6" fill="#f1f8e9" stroke="#43a047" stroke-dasharray="4 3"/>
  <text x="800" y="192" text-anchor="middle" font-size="11" fill="#555">mTLS · routing · telemetry</text>

  <!-- Arrows -->
  <line x1="150" y1="155" x2="210" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="155" x2="430" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="155" x2="690" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Control plane -->
  <rect x="210" y="280" width="480" height="110" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="450" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Control Plane — Istiod</text>
  <text x="450" y="330" text-anchor="middle" font-size="13" fill="#555">Discovers services · issues certificates · pushes proxy config</text>
  <text x="450" y="352" text-anchor="middle" font-size="13" fill="#555">VirtualService · DestinationRule · PeerAuthentication · AuthorizationPolicy</text>
  <text x="450" y="374" text-anchor="middle" font-size="13" fill="#555">Telemetry: Prometheus · Grafana · Jaeger / Zipkin</text>

  <!-- Dashed lines from control plane to proxies -->
  <line x1="285" y1="280" x2="285" y2="190" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="530" y1="280" x2="590" y2="220" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="790" y1="280" x2="850" y2="220" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Legend -->
  <text x="450" y="430" text-anchor="middle" font-size="13" fill="#555">Data plane (sidecars) carries traffic · Control plane configures it · Application code stays untouched</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
